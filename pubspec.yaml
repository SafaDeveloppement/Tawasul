name: tawasul_application
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # UI packages
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.0
  font_awesome_flutter: ^10.8.0
  dots_indicator: ^4.0.1

  # Maps & location
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  google_maps_flutter: ^2.12.3
  location: ^8.0.1
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  geolocator_android: ^5.0.2
  geocoding: ^4.0.0

  # State management & utils
  provider: ^6.1.5
  flutter_screenutil: ^5.9.3
  responsive_framework: ^1.5.1
  platform: ^3.1.6
  carousel_slider: ^5.1.1

  # Media & storage
  image_picker: ^1.1.2
  http: ^1.0.0-beta.2
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  cached_network_image: ^3.3.0
  pdf: ^3.10.4
  

  # Communication
  url_launcher: ^6.3.2
  pinput: ^5.0.1
  flutter_html: ^3.0.0
  qr_flutter: ^4.1.0
  path_provider: ^2.1.5
  flutter_staggered_animations: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.0
  flutter_lints: ^5.0.0

